name: make-keystore

# 只跑一次：在云端生成正式签名密钥。跑完在 artifact 里下载 whattoeat.jks。
on:
  workflow_dispatch:
    inputs:
      password:
        description: '密钥库口令（自己定，至少 6 位，务必记牢）'
        required: true

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成密钥库
        env:
          PASS: ${{ inputs.password }}
        run: |
          set -e
          KT="$(dirname "$(readlink -f "$(which java)")")/keytool"
          "$KT" -genkeypair -v \
            -keystore whattoeat.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias whattoeat -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=WhatToEat, O=WhatToEat, C=CN"
          ls -l whattoeat.jks

      - uses: actions/upload-artifact@v4
        with:
          name: whattoeat-keystore
          path: whattoeat.jks
          if-no-files-found: error
