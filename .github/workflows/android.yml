name: android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 同步网页到 assets
        run: |
          set -e
          mkdir -p delivery/android/app/src/main/assets/www/data
          cp index.html app.js styles.css delivery/android/app/src/main/assets/www/
          cp manifest.webmanifest favicon-32.png apple-touch-icon.png icon-192.png icon-512-rounded.png delivery/android/app/src/main/assets/www/ 2>/dev/null || true
          cp data/dishes.js delivery/android/app/src/main/assets/www/data/
          if [ -f data/dishes.generated.js ]; then
            cp data/dishes.generated.js delivery/android/app/src/main/assets/www/data/
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 校验图标资源
        run: |
          set -e
          R=delivery/android/app/src/main/res
          if [ -d "$R/res" ]; then
            echo "::error::发现嵌套目录 $R/res，AAPT2 会报 invalid resource directory name。请删掉它再重跑。"
            find "$R/res" -type f | sort
            exit 1
          fi
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi mipmap-anydpi-v26 drawable-nodpi; do
            test -d "$R/$d" || { echo "::error::缺少资源目录 $R/$d"; exit 1; }
          done
          for f in mipmap-anydpi-v26/ic_launcher.xml mipmap-anydpi-v26/ic_launcher_round.xml \
                   mipmap-xxxhdpi/ic_launcher.png mipmap-xxxhdpi/ic_launcher_round.png \
                   mipmap-xxxhdpi/ic_launcher_foreground.png drawable-nodpi/ic_launcher_background.png; do
            test -f "$R/$f" || { echo "::error::缺少资源文件 $R/$f"; exit 1; }
          done
          echo "图标资源检查通过"
          ls "$R"

      - name: 准备签名密钥
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > delivery/android/whattoeat.jks
            echo "已载入正式签名密钥（$(stat -c%s delivery/android/whattoeat.jks) 字节）"
          else
            echo "没有配置签名密钥，本次用 debug 签名：能装能用，但以后换正式密钥就不能覆盖升级。"
          fi

      - name: 构建 release APK
        working-directory: delivery/android
        env:
          KEYSTORE_PATH: whattoeat.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          gradle assembleRelease --no-daemon --stacktrace
          echo "---- 产物"
          find app/build/outputs/apk -name '*.apk' -print

      - name: 签名检查
        working-directory: delivery/android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          KEYTOOL=$(dirname $(readlink -f $(which java)))/keytool
          "$KEYTOOL" -printcert -jarfile "$APK" | head -n 12 || true

      - uses: actions/upload-artifact@v4
        with:
          name: whattoeat-apk
          path: delivery/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
