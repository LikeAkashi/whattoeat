name: android
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: sync web assets
        run: |
          mkdir -p delivery/android/app/src/main/assets/www/data
          cp index.html app.js styles.css delivery/android/app/src/main/assets/www/
          cp data/dishes.js delivery/android/app/src/main/assets/www/data/
          if [ -f data/dishes.generated.js ]; then cp data/dishes.generated.js delivery/android/app/src/main/assets/www/data/; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: build apk
        working-directory: delivery/android
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: whattoeat-apk
          path: delivery/android/app/build/outputs/apk/debug/*.apk
